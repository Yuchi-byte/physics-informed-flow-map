# Pre-commit hooks. Install once after clone: `uv run pre-commit install`.
# Both hooks run the package-wide check (not per-file), so pass_filenames is off.
repos:
  - repo: local
    hooks:
      - id: mypy
        name: mypy (package src + tests)
        entry: uv run mypy packages/physics-informed-flow-map/src packages/physics-informed-flow-map/tests
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (package tests)
        entry: uv run pytest packages/physics-informed-flow-map/tests -q
        language: system
        types: [python]
        pass_filenames: false
