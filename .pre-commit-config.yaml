# Pre-commit hooks. Install once after clone: `uv run pre-commit install`.
# ruff hooks run per changed file (scoped to our code, never the vendored
# packages); mypy/pytest run the package-wide check (pass_filenames off).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(packages/physics-informed-flow-map|experiments)/

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(packages/physics-informed-flow-map|experiments)/

      - id: mypy
        name: mypy (package src + tests)
        entry: uv run mypy packages/physics-informed-flow-map/src packages/physics-informed-flow-map/tests
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (package tests)
        entry: uv run pytest packages/physics-informed-flow-map/tests -q
        language: system
        types: [python]
        pass_filenames: false
