# @package _global_
defaults:
  - override /model: dit
  - override /dataset: openfwi

training:
  n_epochs: 100
  batch_size: 256
  lr: 1.0e-4
  warmup_steps: 500   # same wall-clock warmup; fewer steps/epoch at batch 256
  eval_every_epochs: 20
  ckpt_every_epochs: 20
  ema:
    enabled: true
sampling:
  sampler_steps: 200
