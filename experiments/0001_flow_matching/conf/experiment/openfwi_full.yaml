# @package _global_
# Full-OpenFWI velocity-map prior: all 10 families (~470k maps, ~423k after the
# 0.1 val split -> ~6.6k steps/epoch at batch 64). 30 epochs ~= 198k steps, ~2x
# mfm's 100k-step OpenFWI run. lr 1e-4 + 2000-step warmup mirror mfm.
defaults:
  - override /model: dit
  - override /dataset: openfwi

dataset:
  families:
    - CurveFault_A
    - CurveFault_B
    - CurveVel_A
    - CurveVel_B
    - FlatFault_A
    - FlatFault_B
    - FlatVel_A
    - FlatVel_B
    - Style_A
    - Style_B

training:
  n_epochs: 30
  batch_size: 64
  lr: 1.0e-4
  warmup_steps: 2000
  eval_every_epochs: 3  # ~20k steps between evals/checkpoints (epochs are ~6.6k steps)
  ckpt_every_epochs: 3
  artifact_every_epochs: 6
  ema:
    enabled: true
sampling:
  sampler_steps: 200
  n_eval_samples: 64
