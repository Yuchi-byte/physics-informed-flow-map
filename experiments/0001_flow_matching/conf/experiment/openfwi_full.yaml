# @package _global_
# Definitive full-OpenFWI velocity-map prior: all 10 2D families (470k maps; 423k train /
# 47k val under the per-family 0.1 split). bs 256 + lr 2e-4 (sqrt-scaled from the literature's
# 1e-4 @ bs 64) x 90 epochs = ~148.7k steps / 38M samples — 2x the sample budget of the
# 200k-400k-step @ bs 64 band (KAUST 2402.06277 & 2412.06959 = 200k; RED-DiffEq 2509.21659 =
# 400k). dit_b (~130M) per spec §5; bf16 verified loss-parity vs fp32 on FlatVel_A (2026-07-06).
# ckpt_every_epochs 0 = only best + final artifacts (wandb free-plan quota, spec §6.1).
# Design: docs/superpowers/specs/2026-07-06-full-openfwi-priors-design.md
defaults:
  - override /model: dit_b
  - override /dataset: openfwi

dataset:
  families:
    - CurveFault_A
    - CurveFault_B
    - CurveVel_A
    - CurveVel_B
    - FlatFault_A
    - FlatFault_B
    - FlatVel_A
    - FlatVel_B
    - Style_A
    - Style_B
  split_scheme: per_family
  hflip: true

training:
  n_epochs: 90
  batch_size: 256
  lr: 2.0e-4
  warmup_steps: 2000
  num_workers: 8
  precision: bf16
  eval_every_epochs: 5
  ckpt_every_epochs: 0
  ema:
    enabled: true
sampling:
  sampler_steps: 200
