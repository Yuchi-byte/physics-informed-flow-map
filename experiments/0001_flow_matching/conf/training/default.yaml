n_epochs: 10
batch_size: 256
lr: 0.001
warmup_steps: 0  # linear LR warmup (0.1x -> 1x); 0 = off. Distinct from ema.warmup_steps.
eval_every_epochs: 0
ckpt_every_epochs: 0  # local checkpoint save + wandb artifact upload cadence (0 = only best + final)
ema:
  enabled: false
  decay: 0.999
  warmup_steps: 0
