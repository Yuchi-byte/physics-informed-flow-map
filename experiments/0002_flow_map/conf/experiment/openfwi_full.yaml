# @package _global_
# Full-OpenFWI velocity-map prior: all 10 families (~470k maps, ~423k after the
# 0.1 val split -> ~6.6k steps/epoch at batch 64). 45 epochs ~= 297k steps, mid the
# corroborated 200k-400k-step band for diffusion/flow priors on OpenFWI (KAUST
# 2402.06277 & 2412.06959 = 200k; RED-DiffEq 2509.21659 = 400k). lr 1e-4 matches the
# near-universal value; 2000-step warmup + no-decay schedule are upstream mfm.
defaults:
  - override /model: dit
  - override /dataset: openfwi

dataset:
  families:
    - CurveFault_A
    - CurveFault_B
    - CurveVel_A
    - CurveVel_B
    - FlatFault_A
    - FlatFault_B
    - FlatVel_A
    - FlatVel_B
    - Style_A
    - Style_B

training:
  n_epochs: 45
  batch_size: 64
  lr: 1.0e-4
  warmup_steps: 2000
  eval_every_epochs: 3  # ~20k steps between evals (epochs are ~6.6k steps)
  ckpt_every_epochs: 15  # local save + wandb artifact upload every 15 epochs (also best + final)
  ema:
    enabled: true
sampling:
  sampler_steps: 200
