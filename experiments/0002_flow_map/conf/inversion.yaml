defaults:
  - _self_
  - dataset: openfwi
  - method: flow_tilt

seed: 0
ckpt: ""  # trained flow-map prior (a run.py checkpoint); empty = untrained, plumbing only
target_index: 0  # index into the seed-0 validation split selecting the held-out target map
n_samples: 4
steps: 200  # tilting sampler steps (matched to 0003 diffusion sampler cost)

hydra:
  run:
    dir: runs/0002_flow_map/inversion/${now:%Y-%m-%dT%H-%M-%SZ}
  sweep:  # keep --multirun output under the gitignored runs/, not a root multirun/
    dir: runs/0002_flow_map/inversion/${now:%Y-%m-%dT%H-%M-%SZ}
    subdir: ${hydra.job.num}
  job:
    chdir: false
