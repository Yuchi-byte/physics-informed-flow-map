n_epochs: 10
batch_size: 64
lr: 0.001  # peak Adam learning rate
warmup_steps: 2000  # linear LR warmup, 0.1x -> 1x over this many optimizer steps
num_workers: 4  # DataLoader workers
precision: bf16 
resume_from: null  # raw-model checkpoint (step_<E>.pt) to resume from; n_epochs stays the TOTAL

# --- Flow-map (off-diagonal) consistency term ---
flow_map_warmup_steps: 0 # off-diagonal consistency term turns on after this step (pure FM before)
flow_map_anneal_end: 0 # step by which the jump size u-s has annealed to its full range
distillation_type: mf     # esd_teacher, lsd, psd, mf (vss from data) 
loss_weighting: adaptive  # 'adaptive' or 'l2'. Adaptive recovers mfm's adaptive losses. If 'l2', those adaptive losses are set to None.  
                          # And those are the loss_types:{l2, lv, adaptive} used in mfm's loss function. Loss_types determines how the losses between model prediction and targets are calculated. 
                          # mfm sets their loss types to be adaptive for the three losses (fm, distill_fm, distillation). 
                          # see mfm paper Appendix B.3 for adaptive loss. 

# --- Conditioning schedule (the posterior pathway that inference / MFM-G steers) ---
# Inference (FlowMapSteerModule) feeds the running state x_t back as (t_cond=t, x_cond=x_t) to draw one-shot posterior samples.
uncond_prob: 0.1  # P(a training sample is unconditional, t_cond=0). 0.1 => 90% of samples train the
                  # conditional posterior pathway. (mfm cfg key: t_cond_0_rate)
t_cond_power: 1.0 
t_cond_warmup_steps: 0  # keep t_cond=0 (unconditional only) for this many steps before the schedule
                        # above kicks in

# --- Teacher distillation (optional alternative to from-scratch "mf") ---
teacher_ckpt: null  


eval_every_epochs: 0  # 0 = no periodic eval (only the final eval)
ckpt_every_epochs: 0  # 0 = save only best + final checkpoints

ema:
  enabled: false
  decay: 0.9999  
  warmup_steps: 0  # ramp the EMA decay up over this many steps before using `decay`
