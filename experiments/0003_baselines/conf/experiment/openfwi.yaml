# @package _global_
# Diffusion prior on FlatVel_A (~30k maps). lr 1e-4 + warmup + T=1000 + eps-pred match the
# OpenFWI diffusion literature (KAUST / DiffusionVel). ~469 steps/epoch at batch 64.
defaults:
  - override /dataset: openfwi
training:
  n_epochs: 100
  batch_size: 64
  lr: 1.0e-4
  warmup_steps: 2000
  eval_every_epochs: 10
  ckpt_every_epochs: 10
  ema:
    enabled: true
diffusion:
  num_train_timesteps: 1000
  num_sample_steps: 200
sampling:
  n_eval_viz: 64
