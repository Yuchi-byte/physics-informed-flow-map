defaults:
  - _self_
  - model: unet
  - dataset: openfwi
  - diffusion: default
  - method: dps

seed: 0
ckpt: ""  # trained diffusion prior (a run.py checkpoint); empty = untrained, plumbing only
target_index: 0  # index into the seed-0 validation split selecting the held-out target map
n_samples: 4

hydra:
  run:
    dir: runs/0003_baselines/inversion/${now:%Y-%m-%dT%H-%M-%SZ}
  sweep:  # keep --multirun output under the gitignored runs/, not a root multirun/
    dir: runs/0003_baselines/inversion/${now:%Y-%m-%dT%H-%M-%SZ}
    subdir: ${hydra.job.num}
  job:
    chdir: false
