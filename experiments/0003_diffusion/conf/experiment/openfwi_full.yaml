# @package _global_
# Definitive full-OpenFWI diffusion prior over all 10 2D families (470k maps; 423k train /
# 47k val under the per-family 0.1 split), the diffusion counterpart to 0001's openfwi_full.
# bs 256 + lr 2e-4 x 60 epochs = ~99k steps / 25M samples (keeps the 2:3 ratio to the flow
# priors' budget that the earlier 30-vs-45-epoch configs used). dit_b eps-denoiser
# (architecture-matched to 0001/0002), T=1000, bf16; ckpt_every_epochs 0 = only best + final
# artifacts (wandb free-plan quota, spec §6.1).
# Design: docs/superpowers/specs/2026-07-06-full-openfwi-priors-design.md
defaults:
  - override /model: dit_b
  - override /dataset: openfwi
dataset:
  families:
    - CurveFault_A
    - CurveFault_B
    - CurveVel_A
    - CurveVel_B
    - FlatFault_A
    - FlatFault_B
    - FlatVel_A
    - FlatVel_B
    - Style_A
    - Style_B
  split_scheme: per_family
  hflip: true
training:
  n_epochs: 60
  batch_size: 256
  lr: 2.0e-4
  warmup_steps: 2000
  num_workers: 8
  precision: bf16
  eval_every_epochs: 5
  ckpt_every_epochs: 0
  ema:
    enabled: true
diffusion:
  num_train_timesteps: 1000
  num_sample_steps: 200
sampling:
  n_eval_viz: 64
