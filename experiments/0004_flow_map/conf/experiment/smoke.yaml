# @package _global_
defaults:
  - override /model: mlp
  - override /dataset: gaussians

training:
  n_epochs: 1
  flow_map_warmup_steps: 5  # activate the off-diagonal mf term early so the smoke exercises it
  flow_map_anneal_end: 100
sampling:
  n_eval_viz: 256  # denser gaussians scatter for the final viz
