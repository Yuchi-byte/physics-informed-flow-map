name: mfm_gf  # Meta Flow Maps gradient-FREE steering — paper Eq. 20 (the non-differentiable fallback)
drift_estimator: sne  # self-normalised, reward-weighted posterior average; no backprop through r
mc_samples: 4  # posterior draws per step; wave solves/step scale with this
# Likelihood temperature in the softmax reward weights r = -||F(v)-d||^2 / (2 sigma^2): smaller
# concentrates the weights on the best draw. Scaled to the noiseless seismic-residual magnitude.
sigma: 1000.0
guidance_strength: 1.0  # steering scale (0 => unguided base drift, the control)
# Rescale the steering drift to ||base_drift||·guidance_strength each step so the data term is a
# first-order effect regardless of misfit scale (paper's ImageNet practice; see mfm_g.yaml for the
# noiseless-inverse-crime over-fit tradeoff).
renorm: true
sde: true  # SDE (Euler-Maruyama) sampler; false => ODE (Euler)
misfit: l2  # guidance data-misfit: l2 | ot (Peng et al. OT potential; eval metrics stay L2)
ot_k: 100.0  # ot only: bounded amplitude-weighting strength
