defaults:
  - _self_
  - model: dit_fwi
  - SI: linear

resume_from_checkpoint: null

# Path to wherever the OpenFWI data lives on RunPod
# (set via CLI: data_dir=/workspace/data/openfwi)
data_dir: /workspace/data/openfwi

dataset:
  name: openfwi
  img_resolution: 64    # resize 70x70 → 64x64 to match model input_size
  img_channels: 1
  use_vae: false        # pixel-space training — no VAE needed

wandb:
  project: flow-matching-fwi
  entity: lyra-love-guo-university-of-cambridge
  name: openfwi-run1

hydra:
  run:
    dir: /workspace/outputs/${now:%Y-%m-%d_%H-%M-%S}

seed: 42

lr:
  val: 0.0001
  warmup_steps: 2000

trainer:
  num_train_steps: 100000
  batch_size: 4
  ema:
    decay: 0.9999
  devices: "auto"
  num_nodes: 1
  num_workers: 0
  log_every_n_steps: 25
  accumulate_grad_batches: 4
  precision: "bf16-mixed"
  gradient_clip_val: 1.5
  checkpoint_every_n_steps: 10000

sampling:
  every_n_steps: 5000
  n_samples: 16
  n_steps: 50
