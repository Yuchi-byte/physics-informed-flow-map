defaults:
  - _self_
  - model: sit_xl_2
  - SI: linear

resume_from_checkpoint: null

# Path to wherever the OpenFWI data lives on RunPod
# (set via CLI: data_dir=/workspace/data/openfwi)
data_dir: /workspace/data/openfwi

dataset:
  name: openfwi
  img_resolution: 256   # velocity maps are 70x70 natively; upsampled for the VAE
  img_channels: 1       # grayscale; the training script broadcasts to 3ch for the VAE

wandb:
  project: flow-matching-fwi
  name: openfwi-run1

hydra:
  run:
    dir: /workspace/outputs/${now:%Y-%m-%d_%H-%M-%S}

seed: 42

lr:
  val: 0.0001
  warmup_steps: 2000

trainer:
  num_train_steps: 100000
  batch_size: 16
  ema:
    decay: 0.9999
  devices: "auto"
  num_nodes: 1
  num_workers: 4
  log_every_n_steps: 25
  accumulate_grad_batches: 1
  precision: "bf16-mixed"
  gradient_clip_val: 1.5
  checkpoint_every_n_steps: 10000

sampling:
  every_n_steps: 5000
  n_samples: 16
  n_steps: 50
