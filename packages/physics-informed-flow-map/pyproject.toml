[project]
name = "physics-informed-flow-map"
version = "0.1.0"
description = "Physics-informed flow maps: PIDM-style constraint losses on the MFM flow-map framework."
readme = "README.md"
authors = [
    { name = "MarkHaoxiang", email = "mark.haoxiang@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.13.0",
  "diffusers>=0.31.0.dev0",
  "dill>=0.4.1",
  "hf-transfer>=0.1.9",
  "hydra-core>=1.3.2",
  "imageio>=2.37.3",
  "imscore>=0.0.10",
  "lightning>=2.6.0.dev20251019",
  "matplotlib>=3.9.0",
  "mfm",
  "omegaconf>=2.3.0",
  "pillow>=10.0.0",
  "pydantic>=2.11",
  "scipy>=1.17.0",
  "timm>=1.0.22",
  "torch>=2.6.0",
  "torchdiffeq>=0.2.5",
  "torchvision>=0.20.0",
  "transformers>=4.50.1",
  "wandb>=0.23.0",
]

[project.scripts]
physics-informed-flow-map = "physics_informed_flow_map:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"
