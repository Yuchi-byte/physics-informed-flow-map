# Virtual workspace root: tooling + dependency coordination only. The actual
# packages live under packages/ (see [tool.uv.workspace] members below).

[tool.uv.workspace]
members = [
  "packages/physics-informed-flow-map",
  "packages/mfm-meta-flow-map-main",
]

# PyTorch cu128 — matches RTX 5090 / driver 570 (CUDA 12.8 max).
# Update the index name/URL here if moving to a pod with a different CUDA driver:
#   cu121 → https://download.pytorch.org/whl/cu121
#   cu124 → https://download.pytorch.org/whl/cu124
#   cu128 → https://download.pytorch.org/whl/cu128
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
mfm = { workspace = true }
physics-informed-flow-map = { workspace = true }
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[dependency-groups]
dev = [
  "physics-informed-flow-map",
  "ruff>=0.15.14",
  "mypy>=1.11",
  "pytest>=8",
  "pre-commit>=4",
  "ipykernel>=7.2.0",
  "jupyter>=1.1.1",
  "nbconvert>=7.17.1",
]

[tool.mypy]
mypy_path = ["packages/physics-informed-flow-map/src"]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_generics = false
disallow_any_explicit = false
# Experiments are standalone Hydra scripts in digit-prefixed dirs (not importable packages),
# so run.py/inversion.py collide as duplicate modules — check each dir on its own base.
explicit_package_bases = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["mfm.*", "diffusers.*", "torchvision.*", "matplotlib.*", "torchdiffeq.*", "wandb.*", "hydra.*", "tqdm.*", "deepwave.*"]
ignore_missing_imports = true

[tool.ruff]
# Never lint/format the vendored reference packages — they are upstream code.
extend-exclude = [
  "packages/mfm-meta-flow-map-main",
  "packages/PBFM",
  "packages/PhysicsInformedDiffusionModels-main",
  "packages/diffefwi",
]
