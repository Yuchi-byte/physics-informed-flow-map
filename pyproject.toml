# Virtual workspace root: tooling + dependency coordination only. The actual
# packages live under packages/ (see [tool.uv.workspace] members below).

# Detect the installed CUDA driver at sync time and pick the matching PyTorch
# wheels, falling back to CPU when no GPU is available.
[tool.uv]
torch-backend = "auto"

[tool.uv.workspace]
members = [
  "packages/physics-informed-flow-map",
  "packages/mfm-meta-flow-map-main",
]

[tool.uv.sources]
mfm = { workspace = true }
physics-informed-flow-map = { workspace = true }

[dependency-groups]
dev = [
  "physics-informed-flow-map",
  "ruff>=0.15.14",
  "mypy>=1.11",
  "pytest>=8",
  "pre-commit>=4",
  "ipykernel>=7.2.0",
  "jupyter>=1.1.1",
  "nbconvert>=7.17.1",
]

[tool.mypy]
mypy_path = ["packages/physics-informed-flow-map/src"]
strict = true
disallow_any_generics = false
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["mfm.*", "diffusers.*", "torchvision.*", "matplotlib.*", "torchdiffeq.*"]
ignore_missing_imports = true
